name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          API_KEY: ${{ vars.API_KEY }}
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          # Vite exposes build-time env vars starting with `VITE_` to the frontend bundle.
          VITE_API_KEY: ${{ vars.API_KEY }}
          VITE_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          VITE_PROJECT_ID: ${{ vars.PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENAI_API_KEY: ${{ vars.VITE_OPENAI_API_KEY }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Add SPA fallback (404.html)
        run: |
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

