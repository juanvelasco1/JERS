name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Si las variables VITE_SUPABASE_* están solo en Settings → Environments → github-pages,
    # este job debe usar ese entorno o el build queda sin Supabase (Storage no sube en Pages).
    # Si el workflow se queda “esperando aprobación” o falla por rama, en ese entorno añade la
    # rama `main` en “Deployment branches”, o mueve las variables a “Repository secrets”.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          API_KEY: ${{ vars.API_KEY || secrets.API_KEY }}
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          PROJECT_ID: ${{ vars.PROJECT_ID || secrets.PROJECT_ID }}
          # Vite exposes build-time env vars starting with `VITE_` to the frontend bundle.
          VITE_API_KEY: ${{ vars.API_KEY || secrets.API_KEY }}
          VITE_GEMINI_API_KEY: ${{ vars.VITE_GEMINI_API_KEY || vars.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID || vars.PROJECT_ID || secrets.VITE_PROJECT_ID || secrets.PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENAI_API_KEY: ${{ vars.VITE_OPENAI_API_KEY || secrets.VITE_OPENAI_API_KEY }}
          VITE_GROQ_API_KEY: ${{ vars.VITE_GROQ_API_KEY || secrets.VITE_GROQ_API_KEY }}
        run: |
          # Fail fast if required runtime env vars are missing.
          echo "Env check: VITE_SUPABASE_ANON_KEY set? $([ -n "$VITE_SUPABASE_ANON_KEY" ] && echo yes || echo no)"
          echo "Env check: VITE_SUPABASE_URL set? $([ -n "$VITE_SUPABASE_URL" ] && echo yes || echo no)"
          echo "Env check: VITE_PROJECT_ID set? $([ -n "$VITE_PROJECT_ID" ] && echo yes || echo no)"
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_ANON_KEY in GitHub Variables."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_URL" ] && [ -z "$VITE_PROJECT_ID" ]; then
            echo "Missing both VITE_SUPABASE_URL and VITE_PROJECT_ID in GitHub Variables."
            exit 1
          fi
          npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Add SPA fallback (404.html)
        run: |
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

